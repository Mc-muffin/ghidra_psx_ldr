name: Build

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ghidra:  ["12.0.2", "12.0.3", "12.0.4", "12.1", "12.1.2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.4"
      - name: Setup Ghidra
        uses: antoniovazquezblanco/setup-ghidra@v2
        with:
          auth_token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ matrix.ghidra }}
      - name: Build Extension
        run: gradle -PGHIDRA_INSTALL_DIR=${{ env.GHIDRA_INSTALL_DIR }} buildExtension
      - name: Get Path
        run: echo "AR_EXTENSION_PATH=$(echo dist/*ghidra_psx_ldr.zip)" >> $GITHUB_ENV
      - name: Get Name
        run: echo "AR_EXTENSION_NAME=$(echo dist/*ghidra_psx_ldr.zip | cut -c 6-)" >> $GITHUB_ENV
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.AR_EXTENSION_NAME }}
          path: ${{ env.AR_EXTENSION_PATH }}
